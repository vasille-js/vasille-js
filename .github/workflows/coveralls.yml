name: CoverAlls Tests

on:
  push:
    branches: [v5-update]
  pull_request:
    branches: [v5]

jobs:
  test-and-coveralls:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 25

      - name: Install Coveralls globally
        run: npm install -g coveralls

      # Loop through each package and run tests sequentially
      - name: Run tests for all packages sequentially and send coverage
        env:
          COVERALLS_REPO_TOKEN: ${{ secrets.COVERALLS_REPO_TOKEN }}
        run: |
          for pkg in core jsx css babel-plugin; do
            echo "== Testing $pkg =="
            cd $pkg
            export COVERALLS_FLAG_NAME=$pkg
            npm i
            npm run build
            npm run test-coverage
            if [ -f coverage/lcov.info ]; then
              coveralls < coverage/lcov.info
            fi
            cd ..
          done
